name: Build Windows timestamp fix v2

on:
  push:
    branches:
      - windows-text-timestamp-fix-v2
    paths:
      - ".github/workflows/build-windows-timestamp-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v1.7.0-windows5-airspyhf-timestamp-v2-beta
  ARCHIVE_NAME: dumphfdl-1.7.0-windows-x64-airspyhf-timestamp-v2-beta.zip

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            python
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-libconfig
            mingw-w64-ucrt-x86_64-soapysdr
            mingw-w64-ucrt-x86_64-soapyrtlsdr
            mingw-w64-ucrt-x86_64-rtl-sdr
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-zlib

      - name: Build liquid-dsp 1.8.3
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          git clone --depth 1 --branch v1.8.3 https://github.com/jgaeddert/liquid-dsp.git

          python - <<'PY'
          from pathlib import Path

          timer = Path("liquid-dsp/src/core/src/timer.c")
          s = timer.read_text(encoding="utf-8")
          s = s.replace(
              "#include <sys/resource.h>\n",
              "#ifndef _WIN32\n#include <sys/resource.h>\n#endif\n",
              1,
          )
          s = s.replace(
              "    struct rusage tic_rusage;\n",
              "#ifndef _WIN32\n    struct rusage tic_rusage;\n#endif\n",
              1,
          )
          old_tic = """    } else if (_q->type == LIQUID_TIMER_RUSAGE) {
              getrusage(RUSAGE_SELF, &_q->tic_rusage);
          """
          new_tic = """    } else if (_q->type == LIQUID_TIMER_RUSAGE) {
          #ifdef _WIN32
              return liquid_error(LIQUID_EINT,"liquid_timer_tic(), RUSAGE timer is unavailable on Windows");
          #else
              getrusage(RUSAGE_SELF, &_q->tic_rusage);
          #endif
          """
          if old_tic not in s:
              raise SystemExit("liquid-dsp timer tic marker not found")
          s = s.replace(old_tic, new_tic, 1)

          old_toc = """    } else if (_q->type == LIQUID_TIMER_RUSAGE) {
              struct rusage toc;
              getrusage(RUSAGE_SELF, &toc);
              // compute run time
              float time_s  = toc.ru_utime.tv_sec - _q->tic_rusage.ru_utime.tv_sec
                            + toc.ru_stime.tv_sec - _q->tic_rusage.ru_stime.tv_sec;
              float time_us = toc.ru_utime.tv_usec - _q->tic_rusage.ru_utime.tv_usec
                            + toc.ru_stime.tv_usec - _q->tic_rusage.ru_stime.tv_usec;
              return time_s + 1e-6f*time_us;
          """
          new_toc = """    } else if (_q->type == LIQUID_TIMER_RUSAGE) {
          #ifdef _WIN32
              return liquid_error(LIQUID_EINT,"liquid_timer_toc(), RUSAGE timer is unavailable on Windows");
          #else
              struct rusage toc;
              getrusage(RUSAGE_SELF, &toc);
              // compute run time
              float time_s  = toc.ru_utime.tv_sec - _q->tic_rusage.ru_utime.tv_sec
                            + toc.ru_stime.tv_sec - _q->tic_rusage.ru_stime.tv_sec;
              float time_us = toc.ru_utime.tv_usec - _q->tic_rusage.ru_utime.tv_usec
                            + toc.ru_stime.tv_usec - _q->tic_rusage.ru_stime.tv_usec;
              return time_s + 1e-6f*time_us;
          #endif
          """
          if old_toc not in s:
              raise SystemExit("liquid-dsp timer toc marker not found")
          s = s.replace(old_toc, new_toc, 1)
          timer.write_text(s, encoding="utf-8", newline="\n")

          cmake = Path("liquid-dsp/CMakeLists.txt")
          c = cmake.read_text(encoding="utf-8")
          marker = "    target_link_libraries(${target} c m)\n"
          replacement = """    if(WIN32)
              target_link_libraries(${target} m)
          else()
              target_link_libraries(${target} c m)
          endif()
          """
          if marker not in c:
              raise SystemExit("liquid-dsp libc link marker not found")
          c = c.replace(marker, replacement, 1)
          cmake.write_text(c, encoding="utf-8", newline="\n")
          print("Patched liquid-dsp timer and Windows libc link")
          PY

          cmake -S liquid-dsp -B liquid-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/ucrt64 \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_AUTOTESTS=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DENABLE_LOGGING=OFF \
            -DENABLE_TIMESTAMPS=OFF
          cmake --build liquid-build
          cmake --install liquid-build

      - name: Build libacars 2.2.1
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          git clone --depth 1 --branch v2.2.1 https://github.com/szpajder/libacars.git
          cmake -S libacars -B libacars-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/ucrt64 \
            -DZLIB=ON -DLIBXML2=OFF -DJANSSON=OFF
          cmake --build libacars-build
          cmake --install libacars-build

      - name: Build libairspyhf
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          git clone https://github.com/airspy/airspyhf.git
          cd airspyhf
          git checkout 24fe8ffcb00b14f827268bbad89ae1392de055e5
          cd ..
          cmake -S airspyhf/libairspyhf -B airspyhf-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/ucrt64
          cmake --build airspyhf-build
          cmake --install airspyhf-build

      - name: Build SoapyAirspyHF
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          git clone https://github.com/pothosware/SoapyAirspyHF.git
          cd SoapyAirspyHF
          git checkout 0b3daf0b47c3c1d0857c873bb184f6a86a37333c
          cd ..
          cmake -S SoapyAirspyHF -B soapyairspyhf-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/ucrt64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build soapyairspyhf-build
          cmake --install soapyairspyhf-build

      - name: Configure and build dumphfdl
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cmake -S . -B build-win -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/ucrt64 \
            -DSOAPYSDR=ON \
            -DETSY_STATSD=OFF \
            -DSQLITE=OFF \
            -DZMQ=OFF \
            -DRDKAFKA=OFF \
            -DPROFILING=OFF 2>&1 | tee "$RUNNER_TEMP/dumphfdl-configure.txt"
          grep -Eq "soapysdr:.*requested: ON, enabled: TRUE" "$RUNNER_TEMP/dumphfdl-configure.txt"
          cmake --build build-win
          ./build-win/src/dumphfdl.exe --help 2>&1 | tee "$RUNNER_TEMP/dumphfdl-help.txt"
          grep -q -- "--soapysdr" "$RUNNER_TEMP/dumphfdl-help.txt"

      - name: Validate deterministic Windows timestamp source
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          grep -Fq 'snprintf(tbuf, tbuf_len, "%04d-%02d-%02d %02d:%02d:%02d"' src/fmtr-text.c
          grep -Fq 'snprintf(tzbuf, tzbuf_len, "UTC");' src/fmtr-text.c
          grep -Fq '"UTC%c%02ld:%02ld"' src/fmtr-text.c
          if grep -Fq 'strftime(tbuf, sizeof(tbuf), "%x %X"' src/fmtr-text.c; then
            echo "ERROR: locale-dependent Windows timestamp formatter remains"
            exit 1
          fi

      - name: Assemble portable package
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          PKG="$GITHUB_WORKSPACE/package"
          rm -rf "$PKG"
          mkdir -p "$PKG/SoapySDR/modules0.8"

          cp build-win/src/dumphfdl.exe "$PKG/"
          cp /ucrt64/bin/SoapySDRUtil.exe "$PKG/"
          cp etc/systable.conf "$PKG/"
          cp LICENSE "$PKG/"
          cp windows/*.ps1 "$PKG/"
          cp windows/README-WINDOWS.txt "$PKG/"
          if [[ -f windows/README-AIRSPYHF.txt ]]; then cp windows/README-AIRSPYHF.txt "$PKG/"; fi

          find /ucrt64/lib/SoapySDR -type f -iname "*.dll" -exec cp -f {} "$PKG/SoapySDR/modules0.8/" ;

          copy_deps() {
            local queue=("$@")
            while (("${#queue[@]}" > 0)); do
              local item="${queue[0]}"
              queue=("${queue[@]:1}")
              while IFS= read -r dep; do
                [[ -f "$dep" ]] || continue
                case "$dep" in
                  /ucrt64/bin/*.dll)
                    local base="$(basename "$dep")"
                    if [[ ! -f "$PKG/$base" ]]; then
                      cp "$dep" "$PKG/$base"
                      queue+=("$PKG/$base")
                    fi
                    ;;
                esac
              done < <(ldd "$item" | awk '/=> \/ucrt64\/bin\// {print $3}')
            done
          }

          seeds=("$PKG/dumphfdl.exe" "$PKG/SoapySDRUtil.exe")
          while IFS= read -r module; do seeds+=("$module"); done < <(find "$PKG/SoapySDR/modules0.8" -type f -iname "*.dll")
          copy_deps "${seeds[@]}"

          cat > "$PKG/TIMESTAMP-FIX-V2.txt" <<'EOF'
          dumphfdl 1.7.0 Windows timestamp fix v2

          This beta rebuild fixes the remaining Windows text timestamp differences.

          With --utc:
            YYYY-MM-DD HH:MM:SS UTC

          Without --utc:
            YYYY-MM-DD HH:MM:SS UTC+HH:MM
            (or UTC-HH:MM as appropriate)

          The Windows text timestamp is no longer locale-dependent and does not
          rely on strftime("%Z") for the UTC label.

          JSON timestamps are unchanged.
          Airspy HF+ / Discovery and RTL-SDR support are retained.
          EOF

      - name: Validate portable package
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          PKG="$GITHUB_WORKSPACE/package"
          export PATH="$PKG:$PATH"
          export SOAPY_SDR_PLUGIN_PATH="$PKG/SoapySDR/modules0.8"
          cd "$PKG"

          ./SoapySDRUtil.exe --info 2>&1 | tee "$RUNNER_TEMP/portable-soapy-info.txt"
          grep -qi "airspyhf" "$RUNNER_TEMP/portable-soapy-info.txt"
          grep -qi "rtlsdr" "$RUNNER_TEMP/portable-soapy-info.txt"

          ./dumphfdl.exe --help 2>&1 | tee "$RUNNER_TEMP/portable-help.txt"
          grep -q -- "--soapysdr" "$RUNNER_TEMP/portable-help.txt"
          grep -q -- "--utc" "$RUNNER_TEMP/portable-help.txt"

          if find . -type f \( -iname "*.exe" -o -iname "*.dll" \) -print0 |
             xargs -0 -n1 ldd 2>/dev/null | grep -qi "msys-2.0.dll"; then
            echo "ERROR: package depends on MSYS runtime"
            exit 1
          fi

      - name: Create ZIP and checksum
        shell: powershell
        run: |
          if (Test-Path $env:ARCHIVE_NAME) { Remove-Item $env:ARCHIVE_NAME -Force }
          Compress-Archive -Path ".\package\*" -DestinationPath $env:ARCHIVE_NAME -CompressionLevel Optimal
          Get-FileHash $env:ARCHIVE_NAME -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: dumphfdl-1.7.0-windows-x64-airspyhf-timestamp-v2-beta
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

      - name: Publish prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Windows x64 dumphfdl 1.7.0 beta rebuild with the second text timestamp fix.

          Fixed on Windows:
          - text timestamps now use a locale-independent YYYY-MM-DD HH:MM:SS layout
          - with --utc the timezone label is emitted explicitly as UTC
          - local-time mode emits an explicit numeric UTC offset instead of relying on %Z

          Unchanged:
          - JSON receive timestamps
          - Airspy HF+ / Discovery support through SoapyAirspyHF
          - RTL-SDR support

          The executable and bundled Soapy modules passed automated build/startup validation. Because this release rebuilds dumphfdl and the remaining issue was discovered on a real Windows installation, it is published as a prerelease pending Dick's live HFDL confirmation.
          "@

          gh release create $env:RELEASE_TAG $env:ARCHIVE_NAME \
            --target windows-text-timestamp-fix-v2 \
            --title "dumphfdl 1.7.0 Windows x64 - timestamp fix v2 beta" \
            --notes $notes \
            --prerelease
