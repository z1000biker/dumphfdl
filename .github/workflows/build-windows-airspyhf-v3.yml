name: Package Windows timestamp fix

on:
  push:
    branches:
      - windows-text-timestamp-fix
    paths:
      - ".github/workflows/build-windows-airspyhf-v3.yml"

permissions:
  contents: write

env:
  BASE_TAG: v1.7.0-windows2-airspyhf
  BASE_ARCHIVE: dumphfdl-1.7.0-windows-x64-soapy-airspyhf.zip
  RELEASE_TAG: v1.7.0-windows3-airspyhf-timestamp
  ARCHIVE_NAME: dumphfdl-1.7.0-windows-x64-soapy-airspyhf-timestamp.zip

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified AirspyHF Windows release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:BASE_TAG --pattern $env:BASE_ARCHIVE --dir .
          Expand-Archive -Path ".\$env:BASE_ARCHIVE" -DestinationPath ".\base-extract" -Force

          $exe = Get-ChildItem ".\base-extract" -Recurse -File -Filter "dumphfdl.exe" | Select-Object -First 1
          if (-not $exe) { throw "dumphfdl.exe not found in base release" }

          $baseRoot = $exe.Directory.FullName
          New-Item -ItemType Directory -Force ".\package" | Out-Null
          Copy-Item -Path (Join-Path $baseRoot "*") -Destination ".\package" -Recurse -Force

          if (-not (Test-Path ".\package\dumphfdl.exe")) { throw "Failed to normalize base package" }
          if (-not (Test-Path ".\package\SoapySDRUtil.exe")) { throw "SoapySDRUtil.exe missing from base package" }

      - name: Patch Windows text timestamp format
        shell: powershell
        run: |
          $path = (Resolve-Path ".\package\dumphfdl.exe").Path
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $old = [System.Text.Encoding]::ASCII.GetBytes("%F %T")
          $new = [System.Text.Encoding]::ASCII.GetBytes("%x %X")

          if ($old.Length -ne $new.Length) { throw "Patch length mismatch" }

          $count = 0
          for ($i = 0; $i -le $bytes.Length - $old.Length; $i++) {
              $match = $true
              for ($j = 0; $j -lt $old.Length; $j++) {
                  if ($bytes[$i + $j] -ne $old[$j]) {
                      $match = $false
                      break
                  }
              }
              if ($match) {
                  for ($j = 0; $j -lt $new.Length; $j++) {
                      $bytes[$i + $j] = $new[$j]
                  }
                  $count++
                  $i += $old.Length - 1
              }
          }

          if ($count -ne 1) { throw "Expected exactly one %F %T string, found $count" }
          [System.IO.File]::WriteAllBytes($path, $bytes)
          Write-Host "Patched exactly one timestamp format string: %F %T -> %x %X"

      - name: Validate patched portable package
        shell: powershell
        run: |
          $path = (Resolve-Path ".\package\dumphfdl.exe").Path
          $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($path))

          if ($ascii.Contains("%F %T")) { throw "Old unsupported timestamp format remains" }
          if (-not $ascii.Contains("%x %X")) { throw "New Windows timestamp format is missing" }

          Push-Location ".\package"
          try {
              $env:PATH = "$PWD;$env:PATH"
              $env:SOAPY_SDR_PLUGIN_PATH = Join-Path $PWD "SoapySDR\modules0.8"

              $oldEap = $ErrorActionPreference
              $ErrorActionPreference = "Continue"

              & .\dumphfdl.exe --help 2>&1 | Out-File "$env:RUNNER_TEMP\dumphfdl-help.txt" -Encoding ASCII
              $dumphfdlExit = $LASTEXITCODE

              & .\SoapySDRUtil.exe --info 2>&1 | Out-File "$env:RUNNER_TEMP\soapy-info.txt" -Encoding ASCII
              $soapyExit = $LASTEXITCODE

              $ErrorActionPreference = $oldEap

              if ($dumphfdlExit -ne 0) { throw "dumphfdl.exe --help failed after timestamp patch (exit $dumphfdlExit)" }
              if ($soapyExit -ne 0) { throw "SoapySDRUtil.exe --info failed (exit $soapyExit)" }

              $soapy = Get-Content "$env:RUNNER_TEMP\soapy-info.txt" -Raw
              if ($soapy -notmatch "(?i)airspyhf") { throw "AirspyHF module not visible" }
              if ($soapy -notmatch "(?i)rtlsdr") { throw "RTL-SDR module not visible" }
          }
          finally {
              Pop-Location
          }

      - name: Add timestamp fix notes
        shell: powershell
        run: |
          @"
          dumphfdl 1.7.0 Windows x64 timestamp fix

          Based on the hardware-tested v1.7.0-windows2-airspyhf release.

          Fixed:
          - Human-readable text output no longer starts with an empty timestamp field on Windows.
          - Windows text formatting uses the standard CRT date/time specifiers %x %X.
          - JSON timestamps are unchanged.
          - Airspy HF+ / Discovery and RTL-SDR support are unchanged.

          Source fix: src/fmtr-text.c on branch windows-text-timestamp-fix
          "@ | Set-Content ".\package\TIMESTAMP-FIX.txt" -Encoding ASCII

      - name: Create ZIP and checksum
        shell: powershell
        run: |
          if (Test-Path $env:ARCHIVE_NAME) { Remove-Item $env:ARCHIVE_NAME -Force }
          Compress-Archive -Path ".\package\*" -DestinationPath $env:ARCHIVE_NAME -CompressionLevel Optimal
          Get-FileHash $env:ARCHIVE_NAME -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: dumphfdl-1.7.0-windows-x64-soapy-airspyhf-timestamp
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Windows x64 dumphfdl 1.7.0 package based on the hardware-tested Airspy HF+ / Discovery release.

          Fixed:
          - human-readable text output no longer starts with an empty timestamp field on Windows
          - Windows now uses supported CRT date/time formatting (%x %X)

          Unchanged:
          - JSON receive timestamps
          - Airspy HF+ / Discovery support through SoapyAirspyHF
          - RTL-SDR support

          The package passed executable startup and bundled SoapySDR module validation before publication.
          "@

          gh release create $env:RELEASE_TAG $env:ARCHIVE_NAME --target windows-text-timestamp-fix --title "dumphfdl 1.7.0 Windows x64 - Airspy HF+ + timestamp fix" --notes $notes
