name: Build Windows x64 SoapySDR + AirspyHF

on:
  push:
    branches:
      - windows-soapy-airspyhf
    paths:
      - ".github/workflows/build-windows-airspyhf-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v1.7.0-windows2-airspyhf
  ARCHIVE_NAME: dumphfdl-1.7.0-windows-x64-soapy-airspyhf.zip

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            unzip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libusb

      - name: Build SoapySDR 0.8.1
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          git clone --depth 1 --branch soapy-sdr-0.8.1 https://github.com/pothosware/SoapySDR.git
          cmake -S SoapySDR -B soapysdr-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/mingw64 -DENABLE_PYTHON=OFF -DENABLE_PYTHON3=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build soapysdr-build
          cmake --install soapysdr-build

      - name: Download known-good Windows package
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.0-windows1 --pattern "dumphfdl-windows-x64-portable.zip" --dir .
          Expand-Archive -Path ".\dumphfdl-windows-x64-portable.zip" -DestinationPath ".\package" -Force
          if (-not (Test-Path ".\package\dumphfdl.exe")) { throw "Base dumphfdl.exe missing" }
          if (-not (Test-Path ".\package\SoapySDRUtil.exe")) { throw "Base SoapySDRUtil.exe missing" }

      - name: Build libairspyhf
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          git clone https://github.com/airspy/airspyhf.git
          cd airspyhf
          git checkout 24fe8ffcb00b14f827268bbad89ae1392de055e5
          cd ..
          cmake -S airspyhf -B airspyhf-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/mingw64
          cmake --build airspyhf-build
          cmake --install airspyhf-build

      - name: Build SoapyAirspyHF
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          git clone https://github.com/pothosware/SoapyAirspyHF.git
          cd SoapyAirspyHF
          git checkout 0b3daf0b47c3c1d0857c873bb184f6a86a37333c
          cd ..
          cmake -S SoapyAirspyHF -B soapyairspyhf-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/mingw64
          cmake --build soapyairspyhf-build
          cmake --install soapyairspyhf-build

      - name: Add AirspyHF module to portable package
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          PKG="$GITHUB_WORKSPACE/package"
          MODDIR="$PKG/SoapySDR/modules0.8"
          mkdir -p "$MODDIR"

          cp -f /mingw64/bin/SoapySDRUtil.exe "$PKG/"
          cp -f /mingw64/bin/libSoapySDR.dll "$PKG/"

          AIRSPY_MODULE="$(find /mingw64/lib/SoapySDR/modules0.8 -maxdepth 1 -type f -iname '*airspyhf*.dll' | head -n1)"
          test -n "$AIRSPY_MODULE"
          cp -f "$AIRSPY_MODULE" "$MODDIR/"

          copy_deps() {
            local item="$1"
            while IFS= read -r dep; do
              [[ -f "$dep" ]] || continue
              case "$dep" in
                /mingw64/bin/libSoapySDR.dll)
                  ;;
                /mingw64/bin/*.dll)
                  cp -f "$dep" "$PKG/"
                  ;;
              esac
            done < <(ldd "$item" | awk '/=> \/mingw64\/bin\// {print $3}')
          }

          copy_deps "$AIRSPY_MODULE"
          copy_deps /mingw64/bin/SoapySDRUtil.exe
          copy_deps /mingw64/bin/libSoapySDR.dll
          for dll in "$PKG"/*.dll; do
            [[ -f "$dll" ]] || continue
            copy_deps "$dll"
          done

          cp -f windows/find-airspyhf.ps1 "$PKG/"
          cp -f windows/receive-airspyhf-example.ps1 "$PKG/"
          cp -f windows/start-dumphfdl.ps1 "$PKG/"
          cp -f windows/README-AIRSPYHF.txt "$PKG/"

      - name: Validate portable package
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          PKG="$GITHUB_WORKSPACE/package"
          export PATH="$PKG:$PATH"
          export SOAPY_SDR_PLUGIN_PATH="$PKG/SoapySDR/modules0.8"

          cd "$PKG"
          ./SoapySDRUtil.exe --info 2>&1 | tee "$RUNNER_TEMP/soapy-info.txt"
          grep -qi "airspyhf" "$RUNNER_TEMP/soapy-info.txt"
          grep -qi "rtlsdr" "$RUNNER_TEMP/soapy-info.txt"

          ./dumphfdl.exe --help 2>&1 | tee "$RUNNER_TEMP/dumphfdl-help.txt"
          grep -q -- "--soapysdr" "$RUNNER_TEMP/dumphfdl-help.txt"

          if find . -type f \( -iname "*.exe" -o -iname "*.dll" \) -print0 |
             xargs -0 -n1 ldd 2>/dev/null | grep -qi "msys-2.0.dll"; then
            echo "ERROR: package depends on MSYS runtime"
            exit 1
          fi

      - name: Create ZIP
        shell: powershell
        run: |
          if (Test-Path $env:ARCHIVE_NAME) { Remove-Item $env:ARCHIVE_NAME -Force }
          Compress-Archive -Path ".\package\*" -DestinationPath $env:ARCHIVE_NAME -CompressionLevel Optimal
          Get-FileHash $env:ARCHIVE_NAME -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: dumphfdl-1.7.0-windows-x64-soapy-airspyhf
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Portable Windows x64 dumphfdl 1.7.0 package with Airspy HF+ / Airspy HF+ Discovery support through SoapyAirspyHF. The known-good v1.7.0-windows1 executable is retained and RTL-SDR support remains included. Automated checks verify that both airspyhf and rtlsdr Soapy modules load and that dumphfdl exposes --soapysdr. Live RF validation requires physical Airspy HF+ hardware."
          gh release create $env:RELEASE_TAG $env:ARCHIVE_NAME --target windows-soapy-airspyhf --title "dumphfdl 1.7.0 Windows x64 - Airspy HF+" --notes $notes
